[project]
name = "lazy-commit"
version = "0.2.3"
description = "A git commit message generator for personal use."
readme = "README.md"
authors = [
    { name = "QIN2DIM", email = "yaoqinse@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.41.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "pyperclip>=1.11.0",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
commit = "smart_commit.cli:app"

# https://hatch.pypa.io/latest/config/build/#explicit-selection
[tool.hatch.build.targets.sdist]
only-include = ["src/smart_commit"]
exclude = [
    "_archive/*.py",
    'tests/',
    'docker/',
    'examples/'
]

# https://hatch.pypa.io/latest/config/build/#packages
[tool.hatch.build.targets.wheel]
packages = ["src/smart_commit"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pip>=26.0.1",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
